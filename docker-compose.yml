services:
  money-s3-mcp:
    build: .
    ports:
      - "${MCP_PORT:-3000}:3000"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MONEY_S3_DOMAIN=${MONEY_S3_DOMAIN}
      - MONEY_S3_CLIENT_ID=${MONEY_S3_CLIENT_ID}
      - MONEY_S3_CLIENT_SECRET=${MONEY_S3_CLIENT_SECRET}
      - MONEY_S3_APP_ID=${MONEY_S3_APP_ID}
      - MONEY_S3_AGENDA_GUID=${MONEY_S3_AGENDA_GUID:-}
      - MONEY_S3_USERNAME=${MONEY_S3_USERNAME:-}
      - MONEY_S3_PASSWORD=${MONEY_S3_PASSWORD:-}
      - MONEY_S3_LOCAL=${MONEY_S3_LOCAL:-false}
      - IMPORT_POLL_TIMEOUT_MS=${IMPORT_POLL_TIMEOUT_MS:-30000}
      - IMPORT_POLL_INTERVAL_MS=${IMPORT_POLL_INTERVAL_MS:-1000}
    restart: unless-stopped
